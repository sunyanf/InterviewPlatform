# Prometheus 抓取配置（MVP 单机形态）
# 经 docker-compose.prod.yml 的 monitoring profile 启动：
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile monitoring up -d prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: ai-interview-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['backend:8080']
        labels:
          env: prod
